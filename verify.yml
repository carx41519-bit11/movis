name: Verify MOVIS
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    defaults:
      run:
        working-directory: MOVIS-deployable
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: movis
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: movis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U movis -d movis_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements-cloud.txt
      - run: python -m unittest discover -s backend -p 'test_*.py'
        env:
          MOVIS_TEST_DATABASE_URL: postgresql://movis:local-ci-test-only@localhost:5432/movis_test
      - run: docker build -t movis-check .
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: MOVIS-deployable/android
      - uses: actions/upload-artifact@v4
        with:
          name: MOVIS-debug-apk
          path: MOVIS-deployable/android/app/build/outputs/apk/debug/*.apk
